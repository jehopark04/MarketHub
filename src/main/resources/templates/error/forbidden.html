<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>접근할 수 없어요</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .wrap { max-width: 480px; margin: 60px auto; text-align: center; }
        h1 { font-size: 1.6em; margin: 20px 0 8px; }
        p.msg { color: #888; margin-bottom: 32px; }
        .menu { display: flex; justify-content: center; gap: 10px; }
        .btn { display: inline-block; padding: 10px 18px; border: 1px solid #333; border-radius: 4px; text-decoration: none; color: #333; font-weight: bold; }
        .btn-primary { background: #333; color: #fff; }

        /* 고개 젓는 듯한 애니메이션 */
        .shake { animation: shake 2.4s ease-in-out infinite; transform-origin: 80px 90px; }
        @keyframes shake {
            0%, 60%, 100% { transform: rotate(0deg); }
            70%           { transform: rotate(-5deg); }
            80%           { transform: rotate(5deg); }
            90%           { transform: rotate(-3deg); }
        }
    </style>
</head>
<body>
<div class="wrap">

    <!-- 막아서는 캐릭터 -->
    <svg width="160" height="170" viewBox="0 0 160 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="접근을 막는 캐릭터">
        <g class="shake">
            <!-- 몸통 -->
            <ellipse cx="80" cy="90" rx="58" ry="54" fill="#f5f5f5" stroke="#333" stroke-width="3"/>
            <!-- 단호한 눈 (일자) -->
            <line x1="50" y1="76" x2="66" y2="76" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <line x1="94" y1="76" x2="110" y2="76" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <!-- 찡그린 눈썹 -->
            <line x1="48" y1="64" x2="66" y2="68" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <line x1="112" y1="64" x2="94" y2="68" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <!-- 굳게 다문 입 -->
            <line x1="66" y1="112" x2="94" y2="112" stroke="#333" stroke-width="3" stroke-linecap="round"/>
        </g>
        <!-- 자물쇠 -->
        <g transform="translate(108, 118)">
            <path d="M 6 10 V 6 a 6 6 0 0 1 12 0 v 4" fill="none" stroke="#333" stroke-width="3"/>
            <rect x="1" y="10" width="22" height="17" rx="3" fill="#ffd9a0" stroke="#333" stroke-width="3"/>
        </g>
    </svg>

    <h1>앗! 접근할 수 없어요</h1>
    <p class="msg" th:text="${message}">본인 상품만 접근할 수 있습니다.</p>

    <div class="menu">
        <a class="btn btn-primary" th:href="@{/my-page/products}">내 상품 목록</a>
        <a class="btn" th:href="@{/products}">상품 목록으로</a>
    </div>
</div>
</body>
</html>
