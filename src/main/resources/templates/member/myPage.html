<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        h1 { margin-bottom: 10px; }
        p.greeting { color: #555; margin-bottom: 30px; }
        .menu { display: flex; flex-direction: column; gap: 12px; max-width: 400px; }
        .btn { display: block; padding: 12px; border: 1px solid #333; border-radius: 4px; text-decoration: none; color: #333; font-weight: bold; text-align: center; background: #fff; cursor: pointer; font-size: 1em; }
        .btn-danger { border-color: #c0392b; color: #c0392b; }
    </style>
</head>
<body>
<a th:href="@{/}">&larr; 홈으로</a>

<h1>마이페이지</h1>
<p class="greeting"><span th:text="${member.name}">이름</span>님, 환영합니다.</p>

<div class="menu">
    <a class="btn" th:href="@{/my-page/products}">내가 등록한 상품</a>
    <a class="btn" th:href="@{/my-page/likes}">내가 찜한 상품</a>
    <form th:action="@{/logout}" method="post">
        <button class="btn btn-danger" type="submit" style="width: 100%;">로그아웃</button>
    </form>
</div>
</body>
</html>
