<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        h1 { margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
        .field-error { border-color: #c0392b; }
        .error-message { color: #c0392b; font-size: 0.9em; margin-top: 4px; }
        .btn { display: inline-block; padding: 8px 14px; border: 1px solid #333; border-radius: 4px; background: #fff; cursor: pointer; }
    </style>
</head>
<body>
<h1>회원가입</h1>

<form th:action="@{/members}" th:object="${memberJoinForm}" method="post">

    <div class="form-group">
        <label for="loginId">아이디</label>
        <input type="text" id="loginId" th:field="*{loginId}" th:errorclass="field-error">
        <div class="error-message" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}">아이디 오류</div>
    </div>

    <div class="form-group">
        <label for="name">이름</label>
        <input type="text" id="name" th:field="*{name}" th:errorclass="field-error">
        <div class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">이름 오류</div>
    </div>

    <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" th:field="*{password}" th:errorclass="field-error">
        <div class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">비밀번호 오류</div>
    </div>

    <div class="form-group">
        <label for="passwordConfirm">비밀번호 확인</label>
        <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" th:errorclass="field-error">
        <div class="error-message" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}">비밀번호 확인 오류</div>
    </div>

    <button class="btn" type="submit">가입하기</button>
</form>
</body>
</html>
