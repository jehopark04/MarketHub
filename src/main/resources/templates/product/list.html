<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        h1 { margin-bottom: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f5f5f5; }
        a { text-decoration: none; color: #333; }
        .btn { display: inline-block; padding: 8px 14px; border: 1px solid #333; border-radius: 4px; }
        .btn-sm { padding: 4px 10px; font-size: 0.9em; }
        .empty { color: #888; padding: 20px 0; }
        .search-bar { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 20px; }
        .search-bar label { display: block; font-size: 0.85em; color: #666; margin-bottom: 4px; }
        .search-bar input, .search-bar select { padding: 8px; box-sizing: border-box; }
        .like-form { margin: 0; }
        .like-btn { border: none; background: none; cursor: pointer; font-size: 1.3em; line-height: 1; padding: 0; }
        .like-btn.on { color: #e0245e; }
        .like-btn.off { color: #bbb; }
    </style>
</head>
<body>
<div class="top-bar">
    <h1>MarketHub 상품 목록</h1>
    <a class="btn" th:href="@{/products/new}">상품 등록</a>
</div>

<form class="search-bar" th:action="@{/products}" th:object="${productSearchCond}" method="get">
    <div>
        <label for="keyword">검색어</label>
        <input type="text" id="keyword" th:field="*{keyword}" placeholder="상품 제목">
    </div>
    <div>
        <label for="minPrice">최소 가격</label>
        <input type="number" id="minPrice" th:field="*{minPrice}" min="0" placeholder="0">
    </div>
    <div>
        <label for="maxPrice">최대 가격</label>
        <input type="number" id="maxPrice" th:field="*{maxPrice}" min="0" placeholder="제한 없음">
    </div>
    <div>
        <label for="grade">등급</label>
        <select id="grade" th:field="*{grade}">
            <option value="">전체</option>
            <option th:each="g : ${grades}" th:value="${g}" th:text="${g}"></option>
        </select>
    </div>
    <button class="btn" type="submit">검색</button>
    <a class="btn" th:href="@{/products}">초기화</a>
</form>

<table>
    <thead>
    <tr>
        <th>찜</th>
        <th>제목</th>
        <th>가격</th>
        <th>등급</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${products}">
        <td>
            <!-- 찜 상태에 따라 다른 폼을 그린다. 사용자에게는 하트 하나를 누르는 것으로 보이지만
                 요청은 "추가"와 "취소"로 나뉘어 있어, 같은 요청을 두 번 보내도 결과가 뒤집히지 않는다.
                 비로그인도 하트가 보이며, 누르면 인터셉터가 로그인 화면으로 보낸다. -->
            <form class="like-form" th:if="${!likedProductIds.contains(product.id)}"
                  th:action="@{/products/{id}/likes(id=${product.id})}" method="post">
                <button class="like-btn off" type="submit" title="찜하기">&#9825;</button>
            </form>
            <form class="like-form" th:if="${likedProductIds.contains(product.id)}"
                  th:action="@{/products/{id}/likes/delete(id=${product.id})}" method="post">
                <button class="like-btn on" type="submit" title="찜 취소">&#9829;</button>
            </form>
        </td>
        <td>
            <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.title}">상품 제목</a>
        </td>
        <td th:text="${product.price} + '원'">가격</td>
        <td th:text="${product.grade}">등급</td>
        <td>
            <a class="btn btn-sm" th:href="@{/products/{id}(id=${product.id})}">상품 상세</a>
        </td>
    </tr>
    </tbody>
</table>

<p class="empty" th:if="${#lists.isEmpty(products)}">조건에 맞는 상품이 없습니다.</p>
</body>
</html>
