<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내가 찜한 상품</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        h1 { margin-bottom: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f5f5f5; }
        a { text-decoration: none; color: #333; }
        .btn { display: inline-block; padding: 8px 14px; border: 1px solid #333; border-radius: 4px; background: #fff; cursor: pointer; }
        .btn-sm { padding: 4px 10px; font-size: 0.9em; }
        .empty { color: #888; padding: 20px 0; }
        .like-form { margin: 0; }
        .like-btn { border: none; background: none; cursor: pointer; font-size: 1.3em; line-height: 1; padding: 0; color: #e0245e; }
    </style>
</head>
<body>
<div class="top-bar">
    <h1>내가 찜한 상품</h1>
    <a class="btn" th:href="@{/my-page}">마이페이지로</a>
</div>

<table>
    <thead>
    <tr>
        <th>찜</th>
        <th>제목</th>
        <th>가격</th>
        <th>등급</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${products}">
        <td>
            <!-- 이 화면의 상품은 모두 찜한 것이므로 취소 폼만 그린다. -->
            <form class="like-form" th:action="@{/products/{id}/likes/delete(id=${product.id})}" method="post">
                <button class="like-btn" type="submit" title="찜 취소">&#9829;</button>
            </form>
        </td>
        <td>
            <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.title}">상품 제목</a>
        </td>
        <td th:text="${product.price} + '원'">가격</td>
        <td th:text="${product.grade}">등급</td>
        <td>
            <a class="btn btn-sm" th:href="@{/products/{id}(id=${product.id})}">상품 상세</a>
        </td>
    </tr>
    </tbody>
</table>

<p class="empty" th:if="${#lists.isEmpty(products)}">찜한 상품이 없습니다.</p>
</body>
</html>
