<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        h1 { margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
        .field-error { border-color: #c0392b; }
        .error-message { color: #c0392b; font-size: 0.9em; margin-top: 4px; }
        .global-error { color: #c0392b; margin-bottom: 16px; }
        .btn { display: inline-block; padding: 8px 14px; border: 1px solid #333; border-radius: 4px; background: #fff; cursor: pointer; }
    </style>
</head>
<body>
<h1>로그인</h1>

<form th:action="@{/login}" th:object="${loginForm}" method="post">

    <div class="global-error" th:if="${#fields.hasGlobalErrors()}">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">로그인 오류</p>
    </div>

    <div class="form-group">
        <label for="loginId">아이디</label>
        <input type="text" id="loginId" th:field="*{loginId}" th:errorclass="field-error">
        <div class="error-message" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}">아이디 오류</div>
    </div>

    <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" th:field="*{password}" th:errorclass="field-error">
        <div class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">비밀번호 오류</div>
    </div>

    <button class="btn" type="submit">로그인</button>
</form>
</body>
</html>
