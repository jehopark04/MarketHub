<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>상품 수정 · MarketHub</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-header__brand" href="/">MarketHub</a>
        <nav class="site-header__nav"></nav>
      </div>
    </header>

    <main class="page">
      <section class="auth" id="product-form-view">
        <h1 class="auth__title" id="form-title">상품</h1>

        <form class="auth__form" id="product-form" novalidate>
          <p class="form-error" role="alert" hidden></p>

          <div class="field">
            <label class="field__label" for="title">제목</label>
            <input class="field__input field__input--lg" type="text" id="title" name="title"
                   maxlength="30" placeholder="30자 이내" />
            <p class="field__error" data-error-for="title"></p>
          </div>

          <div class="field">
            <label class="field__label" for="price">가격</label>
            <input class="field__input field__input--lg" type="number" id="price" name="price"
                   min="0" placeholder="원" />
            <p class="field__error" data-error-for="price"></p>
          </div>

          <div class="field">
            <label class="field__label" for="grade">상태</label>
            <select class="field__input field__input--lg" id="grade" name="grade">
              <option value="">선택하세요</option>
              <option value="S">S</option>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
            </select>
            <p class="field__error" data-error-for="grade"></p>
          </div>

          <div class="field">
            <label class="field__label" for="description">설명</label>
            <textarea class="field__input field__input--lg field__textarea" id="description"
                      name="description" rows="6" maxlength="250"
                      placeholder="250자 이내"></textarea>
            <p class="field__error" data-error-for="description"></p>
          </div>

          <div class="auth__actions">
            <button class="btn" type="submit">저장</button>
          </div>
        </form>

        <p class="auth__alt"><a href="/">상품 목록으로</a></p>
      </section>
    </main>

    <script type="module" src="/js/product-form.js"></script>
  </body>
</html>
