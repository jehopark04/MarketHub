<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 · MarketHub</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-header__brand" href="/">MarketHub</a>
        <!-- 로그인 상태는 js/session.js가 채운다. -->
        <nav class="site-header__nav"></nav>
      </div>
    </header>

    <main class="page">
      <section class="auth">
        <h1 class="auth__title">로그인</h1>
        <p class="auth__lead">MarketHub 계정으로 계속하세요.</p>

        <form class="auth__form" id="login-form" novalidate>
          <p class="form-error" role="alert" hidden></p>

          <div class="field">
            <label class="field__label" for="loginId">아이디</label>
            <input class="field__input field__input--lg" type="text" id="loginId" name="loginId"
                   autocomplete="username" />
            <p class="field__error" data-error-for="loginId"></p>
          </div>

          <div class="field">
            <label class="field__label" for="password">비밀번호</label>
            <input class="field__input field__input--lg" type="password" id="password" name="password"
                   autocomplete="current-password" />
            <p class="field__error" data-error-for="password"></p>
          </div>

          <div class="auth__actions">
            <button class="btn" type="submit">로그인</button>
          </div>
        </form>

        <p class="auth__alt">계정이 없으신가요? <a href="/join">회원가입</a></p>
      </section>
    </main>

    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
