spring.application.name=system

# 세션 id를 URL에 붙이지 않는다(;jsessionid=...). 주소가 공유되면 세션이 함께 넘어간다.
server.servlet.session.tracking-modes=cookie

# 스프링이 던지는 내장 예외(타입 불일치, 없는 경로, 미지원 메서드, Content-Type 불일치)도
# ProblemDetail로 내보낸다. 켜지 않으면 그쪽만 {timestamp, error, path} 모양으로 나가,
# ApiExceptionHandler가 내보내는 {detail, title, instance}와 필드 이름이 어긋난다.
# 클라이언트가 problem.detail을 읽는 순간 그 네 경우만 undefined가 된다.
spring.mvc.problemdetails.enabled=true
