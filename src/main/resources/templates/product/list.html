<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        h1 { margin-bottom: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f5f5f5; }
        a { text-decoration: none; color: #333; }
        .btn { display: inline-block; padding: 8px 14px; border: 1px solid #333; border-radius: 4px; }
        .btn-sm { padding: 4px 10px; font-size: 0.9em; }
        .empty { color: #888; padding: 20px 0; }
    </style>
</head>
<body>
<div class="top-bar">
    <h1>MarketHub 상품 목록</h1>
    <a class="btn" th:href="@{/products/new}">상품 등록</a>
</div>

<table>
    <thead>
    <tr>
        <th>제목</th>
        <th>가격</th>
        <th>등급</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${products}">
        <td>
            <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.title}">상품 제목</a>
        </td>
        <td th:text="${product.price} + '원'">가격</td>
        <td th:text="${product.grade}">등급</td>
        <td>
            <a class="btn btn-sm" th:href="@{/products/{id}(id=${product.id})}">상품 상세</a>
        </td>
    </tr>
    </tbody>
</table>

<p class="empty" th:if="${#lists.isEmpty(products)}">등록된 상품이 없습니다.</p>
</body>
</html>
