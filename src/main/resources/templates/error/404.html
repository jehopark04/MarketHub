<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>페이지를 찾을 수 없어요</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .wrap { max-width: 480px; margin: 60px auto; text-align: center; }
        h1 { font-size: 1.6em; margin: 20px 0 8px; }
        p.msg { color: #888; margin-bottom: 32px; }
        .menu { display: flex; justify-content: center; gap: 10px; }
        .btn { display: inline-block; padding: 10px 18px; border: 1px solid #333; border-radius: 4px; text-decoration: none; color: #333; font-weight: bold; }
        .btn-primary { background: #333; color: #fff; }

        /* 눈물 떨어지는 애니메이션 */
        .tear { animation: drop 1.6s ease-in infinite; }
        @keyframes drop {
            0%   { transform: translateY(0);    opacity: 0; }
            20%  { opacity: 1; }
            80%  { transform: translateY(26px); opacity: 1; }
            100% { transform: translateY(30px); opacity: 0; }
        }
    </style>
</head>
<body>
<div class="wrap">

    <!-- 슬퍼하는 캐릭터 -->
    <svg width="160" height="170" viewBox="0 0 160 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="슬퍼하는 캐릭터">
        <!-- 몸통 -->
        <ellipse cx="80" cy="90" rx="58" ry="54" fill="#f5f5f5" stroke="#333" stroke-width="3"/>
        <!-- 왼쪽 눈 (슬픈 눈썹 모양) -->
        <path d="M 50 72 Q 58 66 66 72" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
        <!-- 오른쪽 눈 -->
        <path d="M 94 72 Q 102 66 110 72" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
        <!-- 볼터치 -->
        <circle cx="48" cy="92" r="7" fill="#f3c5c5"/>
        <circle cx="112" cy="92" r="7" fill="#f3c5c5"/>
        <!-- 슬픈 입 -->
        <path d="M 66 116 Q 80 104 94 116" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
        <!-- 눈물 (떨어지는 애니메이션) -->
        <g class="tear">
            <path d="M 104 80 C 104 80 98 90 98 95 a 6 6 0 0 0 12 0 C 110 90 104 80 104 80 Z" fill="#7ec3e8"/>
        </g>
    </svg>

    <h1>앗! 페이지를 찾을 수 없어요</h1>
    <p class="msg" th:text="${message}">요청하신 내용을 찾지 못했습니다.</p>

    <div class="menu">
        <a class="btn btn-primary" th:href="@{/products}">상품 목록으로</a>
        <a class="btn" th:href="@{/}">홈으로</a>
    </div>
</div>
</body>
</html>
